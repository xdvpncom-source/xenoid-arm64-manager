name: Verify Fleet release
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh install-qa-addon.sh install-toolchain.sh deploy/xenoid-qa-zram native/xenoid-hwcomposer/build.sh
      - run: sha256sum --check qa/manifest.sha256
      - run: python tests/verify_release.py
